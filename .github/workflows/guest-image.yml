name: Warden guest image
on:
  push:
    branches: [main]
    paths: ['deploy/guest/**', '.github/workflows/guest-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
concurrency:
  group: guest-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/warden-guest

jobs:
  build:
    # Self-hosted macOS runner (docs/ci-mac-runner.md); Docker is its Lima
    # VM. The amd64 half runs under QEMU on the arm64 daemon; the Dockerfile
    # only downloads, verifies and unpacks, so emulation costs minutes.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/guest
          platforms: linux/amd64,linux/arm64
          push: true
          # No attestation manifests: the index then holds exactly one image
          # manifest per platform, which is what install.sh resolves.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record the index and per-platform digests
        env:
          REF: ${{ env.IMAGE }}:sha-${{ github.sha }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          # The build output digest is the multi-platform index. Each host
          # installs and pins its own platform's image manifest digest (the
          # digest sbx inspect reports for the loaded copy), so list them.
          docker buildx imagetools inspect "$REF" \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{.Digest}}{{"\n"}}{{end}}{{end}}{{end}}' \
            > platforms.txt
          cat platforms.txt
          {
            echo "## Warden guest image"
            echo
            echo "\`$REF\`"
            echo
            echo "index digest: \`$INDEX_DIGEST\` (do not pin this; pin a platform digest below)"
            echo
            echo "| platform | image manifest digest | install |"
            echo "|---|---|---|"
            while read -r platform digest; do
              echo "| $platform | \`$digest\` | \`sudo deploy/guest/install.sh $REF $digest\` |"
            done < platforms.txt
            echo
            echo "Record each platform digest in chat/internal/release/release.go (GuestImages)."
          } >> "$GITHUB_STEP_SUMMARY"
