name: Warden release
# Builds one Warden release from a tag: the frontend, the five binaries for
# linux/amd64, linux/arm64 and darwin/arm64 with the revision linked in,
# one tarball per target with SHA256SUMS, a GitHub release holding them,
# the multi-architecture server image at ghcr.io/<owner>/warden:<tag>, and
# the Helm chart at oci://ghcr.io/<owner>/charts/warden (chart version =
# the tag without its v, appVersion = the tag, values pinned to the image
# by digest; scripts/package-chart.sh). A manual run builds and pushes the
# image, packages the chart without pushing it, and keeps the tarballs and
# the chart as workflow artifacts under a dev version; it publishes no
# GitHub release.
#
# Runs on the self-hosted macOS runner (docs/ci-mac-runner.md): the build
# and packaging are scripts/release.sh, which handles BSD tar; Docker is the
# runner's Lima VM, reached through DOCKER_HOST from the runner's .env;
# helm is the runner's Homebrew one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/warden
  # helm push appends /<chart name>: the chart is oci://…/charts/warden.
  CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
  PNPM_VERSION: 11.27.0

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    # The amd64 image half runs under QEMU (only a selfcheck of the
    # prebuilt binary and apt), so emulation costs minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dev.$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Warden $version ($GITHUB_SHA)"

      # Toolchains land in the runner's tool cache and stay there; the
      # module and pnpm stores live in the runner user's home, so the
      # Actions cache service adds nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: chat/go.mod
          cache: false
      - name: pnpm via corepack
        run: |
          set -eu
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Build, test, cross-compile and package (scripts/release.sh)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -eu
          scripts/release.sh --version "$VERSION"
          test -f "dist/release/warden-${VERSION}-linux-amd64.tar.gz"
          test -f "dist/release/warden-${VERSION}-linux-arm64.tar.gz"
          test -f "dist/release/warden-${VERSION}-darwin-arm64.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: warden-${{ steps.version.outputs.version }}
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the server image (linux/amd64, linux/arm64)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/chat/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # No attestation manifests: the index holds exactly one image
          # manifest per platform, as the guest image does.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # The chart is versioned with the binary and the image (plan decision
      # 17): chart version <tag without v>, appVersion <tag>, and its values
      # default to the image just pushed, by index digest. The runner's
      # Homebrew helm packages and pushes it.
      - name: Package the chart
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INDEX_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          helm version --short
          tgz="$(scripts/package-chart.sh --version "$VERSION" --image-digest "$INDEX_DIGEST" --image-repository "$IMAGE" --out dist/release)"
          (cd dist/release && { command -v sha256sum >/dev/null 2>&1 && sha256sum -- "$(basename "$tgz")" || shasum -a 256 -- "$(basename "$tgz")"; } >> SHA256SUMS && cat SHA256SUMS)
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: warden-${{ steps.version.outputs.version }}-chart
          path: ${{ steps.chart.outputs.tgz }}
          if-no-files-found: error
      - name: Push the chart
        id: chartpush
        if: github.ref_type == 'tag'
        env:
          TGZ: ${{ steps.chart.outputs.tgz }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The same GHCR login the image push uses (packages: write).
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$TGZ" "$CHARTS" > push.txt 2>&1 || { cat push.txt; exit 1; }
          cat push.txt
          digest="$(sed -n 's/^Digest: //p' push.txt)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record the digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          INDEX_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_REF: ${{ env.CHARTS }}/warden
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          CHART_TGZ: ${{ steps.chart.outputs.tgz }}
          CHART_DIGEST: ${{ steps.chartpush.outputs.digest }}
        run: |
          set -eu
          docker buildx imagetools inspect "$REF" \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{.Digest}}{{"\n"}}{{end}}{{end}}{{end}}' \
            > platforms.txt
          cat platforms.txt
          {
            echo "## Warden $VERSION"
            echo
            echo "Server image \`$REF\` (index digest \`$INDEX_DIGEST\`; pin \`$REF@$INDEX_DIGEST\` in .env as WARDEN_IMAGE)."
            echo
            echo "| platform | image manifest digest |"
            echo "|---|---|"
            while read -r platform digest; do
              echo "| $platform | \`$digest\` |"
            done < platforms.txt
            echo
            echo "### Helm chart"
            echo
            if [ -n "$CHART_DIGEST" ]; then
              echo "\`$CHART_REF\` version \`$CHART_VERSION\` (OCI digest \`$CHART_DIGEST\`; also \`$(basename "$CHART_TGZ")\` below). Its values default to the image above by digest; see docs/warden-kubernetes.md."
              echo
              echo '```'
              echo "helm install warden $CHART_REF --version $CHART_VERSION -n warden --create-namespace -f values.yaml"
              echo '```'
            else
              echo "Packaged as \`$(basename "$CHART_TGZ")\` (workflow artifact) and not pushed: only a tag build pushes to \`$CHART_REF\`."
            fi
            echo
            echo "### Tarballs and chart"
            echo
            echo '```'
            cat dist/release/SHA256SUMS
            echo '```'
            echo
            echo "Unpack one and run \`bin/warden install\` then \`bin/warden start\` (docs/warden-local-install.md). OVH: deploy/chat/README.md, \"Cutover to warden.json\"."
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          CHART_TGZ: ${{ steps.chart.outputs.tgz }}
        run: |
          set -eu
          gh release create "$VERSION" --title "Warden $VERSION" --notes-file notes.md --verify-tag \
            dist/release/*.tar.gz dist/release/SHA256SUMS "$CHART_TGZ"
