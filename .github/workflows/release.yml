name: Warden release
# Builds one Warden release from a tag: the frontend, the five binaries for
# linux/amd64, linux/arm64 and darwin/arm64 with the revision linked in,
# one tarball per target with SHA256SUMS, a GitHub release holding them,
# and the multi-architecture server image at ghcr.io/<owner>/warden:<tag>.
# A manual run builds and pushes the image and keeps the tarballs as a
# workflow artifact under a dev version; it publishes no GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/warden
  PNPM_VERSION: 11.27.0

jobs:
  release:
    runs-on: ubuntu-24.04
    # The arm64 image half runs under QEMU (only a selfcheck of the
    # prebuilt binary and apt), so emulation costs minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="v0.0.0-dev.$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Warden $version ($GITHUB_SHA)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build the frontend (pnpm via corepack)
        run: |
          set -eu
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --dir chat/web install --frozen-lockfile
          pnpm --dir chat/web build
          test -f chat/web/dist/index.html

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: chat/go.mod
          cache-dependency-path: chat/go.sum
      - name: Test
        run: |
          set -eu
          cd chat
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...

      - name: Cross-compile the five binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          cd chat
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="../dist/${os}-${arch}"
            mkdir -p "$out"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X warden/chat/internal/release.Revision=${VERSION}" \
              -o "$out/warden" ./cmd/warden
          done
          # The Linux binary runs on this runner: it and every service
          # subcommand must report the release version.
          ../dist/linux-amd64/warden --version | grep -q "^warden ${VERSION} protocol=" || { echo "warden does not report ${VERSION}"; exit 1; }
          for svc in policy runner serve edge; do
            ../dist/linux-amd64/warden $svc --version | grep -q " ${VERSION} protocol=" || { echo "warden $svc does not report ${VERSION}"; exit 1; }
          done

      - name: Package the tarballs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist/release
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            name="warden-${VERSION}-${target}"
            stage="dist/stage/$name"
            rm -rf "$stage"
            mkdir -p "$stage/bin" "$stage/config" "$stage/vendor"
            cp dist/$target/warden "$stage/bin/"
            cp -R chat/web/dist "$stage/web"
            cp config/policy.template.json "$stage/config/"
            cp vendor/github-operations.json vendor/github-meta.json "$stage/vendor/"
            cp deploy/chat/warden.example.json "$stage/config/warden.server.example.json"
            chmod -R a+rX "$stage"
            tar -C dist/stage --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -czf "dist/release/$name.tar.gz" "$name"
          done
          (cd dist/release && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS)
          # An unpacked tarball must work from bin/ without configuration:
          # the launcher finds web/, vendor/ and config/ beside it.
          tar -C dist/stage -xzf "dist/release/warden-${VERSION}-linux-amd64.tar.gz"
          "dist/stage/warden-${VERSION}-linux-amd64/bin/warden" policy selfcheck
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type != 'tag'
        with:
          name: warden-${{ steps.version.outputs.version }}
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/arm64
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the server image (linux/amd64, linux/arm64)
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/chat/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # No attestation manifests: the index holds exactly one image
          # manifest per platform, as the guest image does.
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record the digests
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REF: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          INDEX_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -eu
          docker buildx imagetools inspect "$REF" \
            --format '{{range .Manifest.Manifests}}{{if .Platform}}{{if ne .Platform.Architecture "unknown"}}{{.Platform.OS}}/{{.Platform.Architecture}} {{.Digest}}{{"\n"}}{{end}}{{end}}{{end}}' \
            > platforms.txt
          cat platforms.txt
          {
            echo "## Warden $VERSION"
            echo
            echo "Server image \`$REF\` (index digest \`$INDEX_DIGEST\`; pin \`$REF@$INDEX_DIGEST\` in .env as WARDEN_IMAGE)."
            echo
            echo "| platform | image manifest digest |"
            echo "|---|---|"
            while read -r platform digest; do
              echo "| $platform | \`$digest\` |"
            done < platforms.txt
            echo
            echo "### Tarballs"
            echo
            echo '```'
            cat dist/release/SHA256SUMS
            echo '```'
            echo
            echo "Unpack one and run \`bin/warden install\` then \`bin/warden start\` (docs/warden-local-install.md). OVH: deploy/chat/README.md, \"Cutover to warden.json\"."
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          gh release create "$VERSION" --title "Warden $VERSION" --notes-file notes.md --verify-tag \
            dist/release/*.tar.gz dist/release/SHA256SUMS
