  namespace: warden
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: runner
spec:
  commonName: warden-runner
  dnsNames:
    - warden-runner
    - warden-runner.warden.svc
    - warden-runner.warden.svc.cluster.local
  secretName: warden-runner-tls
  duration: 8760h
  renewBefore: 720h
  usages: [digital signature, server auth, client auth]
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: corp-ca

