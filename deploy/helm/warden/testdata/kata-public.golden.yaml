# Source: warden/templates/rbac.yaml
# The runner owns sandbox pods and workspace PVCs and runs exec sessions
# in them; nothing outside the sandbox namespace. pods/log is for the
# guest-init output of a sandbox that failed to start (decision 6 lists it
# among the client's verbs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-runner
  namespace: warden-prod-sandboxes
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: runner
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
  # exec over WebSocket is an HTTP GET (verb get); SPDY clients POST (create).
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # The trust-bundle readiness gate (decision 9): the runner creates no
  # sandbox until the guest trust ConfigMap holds a bundle.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [warden-guest-trust]
    verbs: [get, list, watch]

---
# Source: warden/templates/rbac.yaml
# The policy service verifies sandbox pods and grants egress by label
# (get/list/watch/patch on pods), reads the NetworkPolicies that select
# them, runs the two canary pods of decision 12 (create/delete, pods/log
# for their verdicts) and publishes the trust bundle into the ConfigMap the
# chart pre-created (update/patch by name).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-policy
  namespace: warden-prod-sandboxes
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: policy
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [warden-guest-trust]
    verbs: [get, list, watch, update, patch]

---
# Source: warden/templates/rbac.yaml
# In the core namespace the policy service is the credential store
# (decision 8): the named provider login Secrets, read and written through
# the API (Codex refreshes its token), watched so a rotation is picked up.
# list and watch on named Secrets need a metadata.name field selector.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-policy-credentials
  namespace: warden
  labels:
    app.kubernetes.io/name: warden
