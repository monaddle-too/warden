---
# Source: warden/templates/networkpolicies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: warden-policy
  namespace: warden
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: warden
      app.kubernetes.io/instance: warden
      warden.monaddle.com/component: policy
  policyTypes: [Ingress, Egress]
  ingress:
    # Control: the chat and the runner.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: warden
          podSelector:
            matchLabels:
              app.kubernetes.io/name: warden
              app.kubernetes.io/instance: warden
              warden.monaddle.com/component: chat
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: warden
          podSelector:
            matchLabels:
              app.kubernetes.io/name: warden
              app.kubernetes.io/instance: warden
              warden.monaddle.com/component: runner
      ports:
        - protocol: TCP
          port: 7443
    # The gateway: sandbox pods that hold the egress label (decision 4).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: warden-prod-sandboxes
          podSelector:
            matchLabels:
              warden.monaddle.com/egress: gateway
      ports:
        - protocol: TCP
          port: 7000
  egress:
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    - ports:
      - port: 443
        protocol: TCP
      - port: 6443
        protocol: TCP
      to:
      - ipBlock:
          cidr: 0.0.0.0/0
    # Provider egress through the gateway.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

