    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: sandboxes
spec:
  policyName: warden-warden-prod-sandboxes-sandbox-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: warden-prod-sandboxes
