# Source: warden/templates/tls-bootstrap.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: warden-tls-bootstrap
  namespace: warden
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: tls-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warden
        app.kubernetes.io/instance: warden
        app.kubernetes.io/version: "v0.0.0-dev"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: warden-0.0.0-dev
        warden.monaddle.com/component: tls-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: warden-tls-bootstrap
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: issue
          image: "ghcr.io/monaddle-too/warden:v0.0.0-dev"
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/warden, tls, bootstrap, --out, /work/tls, --days, "90"]
          env:
            - name: HOME
              value: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: store
          image: "docker.io/alpine/k8s:1.34.1"
          imagePullPolicy: IfNotPresent
          command: [sh, -eu, -c]
          args:
            - |
              ns="$NAMESPACE"
              ids="warden-policy warden-runner warden-chat warden-edge"
              existing=0
              for id in $ids; do
                if kubectl -n "$ns" get secret "$id-tls" >/dev/null 2>&1; then
                  existing=$((existing + 1))
                fi
              done
              if [ "$existing" -eq 4 ]; then
                echo "all four TLS Secrets exist; nothing to do"
                exit 0
              fi
              if [ "$existing" -ne 0 ]; then
                echo "only $existing of the four TLS Secrets exist; they must share a CA, so delete all four to re-issue" >&2
                exit 1
              fi
              for id in $ids; do
                kubectl -n "$ns" create secret generic "$id-tls" --type=kubernetes.io/tls \
                  --from-file=ca.crt="/work/tls/$id/ca.crt" \
                  --from-file=tls.crt="/work/tls/$id/tls.crt" \
                  --from-file=tls.key="/work/tls/$id/tls.key"
                kubectl -n "$ns" label secret "$id-tls" \
                  app.kubernetes.io/name=warden \
                  app.kubernetes.io/instance="$RELEASE" \
                  warden.monaddle.com/component="${id#warden-}"
              done
              echo "issued a CA and four certificates valid 90 days"
          env:
            - name: HOME
              value: /work
            - name: NAMESPACE
              value: warden
            - name: RELEASE
              value: warden
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi

