# Source: warden/templates/sandbox-namespace.yaml
# The guest trust bundle (decision 9): created empty here so the policy
# service only ever updates it (create cannot be scoped to a name in RBAC),
# and living in the sandbox namespace because a pod can mount only a
# ConfigMap of its own namespace. Helm's three-way merge leaves the data
# the policy service writes alone on upgrade.
apiVersion: v1
kind: ConfigMap
metadata:
  name: warden-guest-trust
  namespace: warden-sandboxes
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: policy

