apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: warden-warden-sandboxes-sandbox-pods
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: sandboxes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: "object.spec.?runtimeClassName.orValue('') == 'kata-qemu'"
      message: "sandbox pods must set runtimeClassName kata-qemu"
      reason: Forbidden
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "sandbox pods must set automountServiceAccountToken: false"
      reason: Forbidden
    - expression: "has(object.metadata.labels) && 'warden.monaddle.com/sandbox' in object.metadata.labels && object.metadata.labels['warden.monaddle.com/sandbox'] != ''"
      message: "sandbox pods must carry the warden.monaddle.com/sandbox label"
      reason: Forbidden
    - expression: "!object.spec.?hostNetwork.orValue(false) && !object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false)"
      message: "sandbox pods may not share host namespaces"
      reason: Forbidden
    - expression: "variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))"
      message: "sandbox pods may not run privileged containers"
      reason: Forbidden
    - expression: "object.spec.?volumes.orValue([]).all(v, has(v.persistentVolumeClaim) || has(v.configMap) || has(v.emptyDir))"
      message: "sandbox pods may use only persistentVolumeClaim, configMap and emptyDir volumes"
      reason: Forbidden

