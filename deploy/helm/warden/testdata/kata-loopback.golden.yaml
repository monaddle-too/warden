# Source: warden/templates/rbac.yaml
# The runner owns sandbox pods and workspace PVCs and runs exec sessions
# in them; nothing outside the sandbox namespace. pods/log is for the
# guest-init output of a sandbox that failed to start (decision 6 lists it
# among the client's verbs).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warden-runner
  namespace: warden-sandboxes
  labels:
    app.kubernetes.io/name: warden
    app.kubernetes.io/instance: warden
    app.kubernetes.io/version: "v0.0.0-dev"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: warden-0.0.0-dev
    warden.monaddle.com/component: runner
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [create, get, list, watch, delete]
  # exec over WebSocket is an HTTP GET (verb get); SPDY clients POST (create).
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # A workspace resize is one patch to the resize subresource (Kubernetes
  # 1.33+): the pod's requests and limits change in place. The pod itself
  # stays unpatchable by the runner; its labels are the policy service's.
  - apiGroups: [""]
    resources: [pods/resize]
    verbs: [patch]
  # The trust-bundle readiness gate (decision 9): the runner creates no
  # sandbox until the guest trust ConfigMap holds a bundle.
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [warden-guest-trust]
    verbs: [get, list, watch]
  # Live CPU and memory of the sandbox pods for the workspace panel and the
  # admin console's Cluster section (docs/warden-startup-visibility-plan.md);
  # absent metrics leave those columns empty.
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]

