          imagePullPolicy: IfNotPresent
          command: [sh, -c, "chown 1000:1000 /var/lib/warden/edge && chmod 0700 /var/lib/warden/edge"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - name: state
              mountPath: /var/lib/warden/edge
      containers:
        - name: edge
          image: "ghcr.io/monaddle-too/warden:v0.0.0-dev"
          imagePullPolicy: IfNotPresent
          args: [warden, edge, --config, /etc/warden/warden.json]
          env:
            - name: HOME
              value: /var/lib/warden/edge
          ports:
            - name: http
              containerPort: 18781
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
