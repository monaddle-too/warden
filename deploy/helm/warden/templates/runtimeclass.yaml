{{- /*
The RuntimeClass of the selected tier, only when the cluster does not
already own it (runtime.createRuntimeClasses; off by default). The
overhead is what the sandbox ResourceQuota charges per pod on top of the
container limits.
*/ -}}
{{- if .Values.runtime.createRuntimeClasses }}
{{- $o := .Values.runtime.overhead }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ include "warden.runtimeClassName" . }}
  labels:
    {{- include "warden.labels" . | nindent 4 }}
    warden.monaddle.com/component: sandboxes
handler: {{ include "warden.runtimeHandler" . }}
{{- if or (int $o.memoryMi) (int $o.cpuMillis) }}
overhead:
  podFixed:
    {{- if int $o.memoryMi }}
    memory: {{ printf "%dMi" (int $o.memoryMi) | quote }}
    {{- end }}
    {{- if int $o.cpuMillis }}
    cpu: {{ printf "%dm" (int $o.cpuMillis) | quote }}
    {{- end }}
{{- end }}
{{- with .Values.sandboxes.nodeSelector }}
scheduling:
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
