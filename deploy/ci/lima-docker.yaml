# Docker engine for the self-hosted macOS CI runner (docs/ci-mac-runner.md).
#
# Lima's docker-rootful template with the runner directory mounted writable:
# the workflows bind-mount paths under $RUNNER_TEMP, and a job's
# `docker run --privileged` (QEMU binfmt for the linux/amd64 image halves)
# needs the rootful daemon. Start it once with
#   limactl start --name=ci-docker deploy/ci/lima-docker.yaml
# and point the runner at the forwarded socket (see the doc).
minimumLimaVersion: 2.0.0
base:
- template:_images/ubuntu-lts

vmType: vz
cpus: 4
memory: 8GiB
disk: 60GiB

mounts:
- location: "~/actions-runner"
  writable: true
- location: "/tmp/lima"
  writable: true

containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
- mode: system
  script: |
    set -eux -o pipefail
    command -v docker >/dev/null 2>&1 && exit 0
    export DEBIAN_FRONTEND=noninteractive
    curl -fsSL https://get.docker.com | sh
- mode: yq
  path: /etc/systemd/system/docker.socket.d/override.conf
  format: ini
  expression: .Socket.SocketUser="{{.User}}"
- mode: yq
  path: /etc/docker/daemon.json
  expression: |
    .features.cdi = true |
    .features.containerd-snapshotter = true

probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 30s bash -c "until command -v docker >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "docker is not installed yet"
      exit 1
    fi
    if ! timeout 30s bash -c "until pgrep dockerd; do sleep 3; done"; then
      echo >&2 "dockerd is not running"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

portForwards:
- guestSocket: "/var/run/docker.sock"
  hostSocket: "{{.Dir}}/sock/docker.sock"
