# Let's Encrypt issuers for the GKE test cluster: DNS-01 in Cloud DNS, so the
# certificate can cover the wildcard preview host. cert-manager's pod acts
# as the Google service account scripts/k8s-gke.sh up binds to it through
# Workload Identity (no key Secret). The script substitutes __PROJECT__ and
# __EMAIL__ and applies the file.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: __EMAIL__
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          cloudDNS:
            project: __PROJECT__
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: __EMAIL__
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - dns01:
          cloudDNS:
            project: __PROJECT__
