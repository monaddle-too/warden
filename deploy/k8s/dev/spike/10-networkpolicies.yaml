# Decision 4: default deny both ways; egress granted by a pod label that one
# static policy selects; the runner is the only ingress source (decision 10).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: warden-spike-sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
  namespace: warden-spike-sandboxes
spec:
  podSelector:
    matchLabels:
      warden.monaddle.com/egress: gateway
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: warden-spike
      podSelector:
        matchLabels:
          app: gateway
    ports:
    - protocol: TCP
      port: 7000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-ingress
  namespace: warden-spike-sandboxes
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: warden-spike
      podSelector:
        matchLabels:
          app: runner
